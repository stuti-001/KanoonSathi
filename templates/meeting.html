{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KanoonSathi | Video Meeting</title>
    <link rel="stylesheet" href="{% static 'style.css' %}" />
  </head>

  <body>
    <div class="meeting-container">
      <div class="meeting-header">
        <div>
          <h2>KanoonSathi Legal Consultation</h2>
          <p id="meetingInfo"></p>
        </div>
        <div class="meeting-info">
          <button onclick="endMeeting()" class="btn-end-call">End Call</button>
          <button
            onclick="logout()"
            class="btn-end-call"
            style="background: #6b7280"
          >
            Logout
          </button>
        </div>
      </div>

      <div class="meeting-video">
        <div id="loading" class="loading-full">
          <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Initializing video conference...</p>
          </div>
        </div>
        <div id="jitsi-container" style="display: none"></div>
        <div id="error" style="display: none"></div>
      </div>

      <div class="meeting-footer">
        <p>
          Make sure your microphone and camera are enabled. The meeting will be
          recorded for your records.
        </p>
      </div>
    </div>

    <script>
      let jitsiApi = null;

      async function initializeMeeting() {
        try {
          const params = new URLSearchParams(window.location.search);
          const meetingId = params.get("id");
          const participantName = params.get("name") || "Guest";

          if (!meetingId) {
            showError("Invalid meeting link");
            return;
          }

          let meetingInfo = "";
          try {
            const auth = JSON.parse(
              localStorage.getItem("kanoon_auth") || "null",
            );
            const email =
              auth && auth.email ? auth.email.trim().toLowerCase() : "";
            if (email) {
              const response = await fetch(
                `/api/appointments?email=${encodeURIComponent(email)}`,
                {
                  credentials: "same-origin",
                },
              );
              if (response.ok) {
                const appointments = await response.json();
                const apt = appointments.find(
                  (a) => String(a.id) === meetingId,
                );
                if (apt) {
                  meetingInfo = `with ${apt.lawyerName || "Lawyer"} | ${apt.date || ""} at ${apt.time || ""}`;
                }
              }
            }
          } catch (e) {}

          document.getElementById("meetingInfo").textContent =
            meetingInfo || "Legal Consultation Meeting";

          const script = document.createElement("script");
          script.src = "https://meet.jitsi.org/external_api.js";
          script.onload = () => {
            startJitsiMeeting(meetingId, participantName);
          };
          script.onerror = () => {
            showError(
              "Could not load video conference. Please check your internet connection.",
            );
          };
          document.head.appendChild(script);
        } catch (error) {
          console.error("Error initializing meeting:", error);
          showError("Failed to initialize meeting.");
        }
      }

      function startJitsiMeeting(meetingId, participantName) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("jitsi-container").style.display = "block";

        const options = {
          roomName: `kanoon-sathi-${meetingId}`,
          width: "100%",
          height: "100%",
          parentNode: document.querySelector("#jitsi-container"),
          userInfo: {
            displayName: participantName,
          },
          configOverwrite: {
            enableWelcomePage: false,
            enableClosePage: false,
            disableDeepLinking: false,
          },
          interfaceConfigOverwrite: {
            DISABLE_JOIN_LEAVE_NOTIFICATIONS: true,
            SHOW_JITSI_WATERMARK: false,
          },
        };

        jitsiApi = new JitsiMeetExternalAPI("meet.jitsi.org", options);

        jitsiApi.addEventListener("videoConferenceLeft", () => {
          endMeeting();
        });
      }

      function endMeeting() {
        if (jitsiApi) jitsiApi.dispose();
        window.location.href = "/";
      }

      function logout() {
        if (jitsiApi) jitsiApi.dispose();
        localStorage.removeItem("kanoon_auth");
        window.location.href = "/";
      }

      function showError(message) {
        document.getElementById("loading").style.display = "none";
        const errorDiv = document.getElementById("error");
        errorDiv.style.display = "block";
        errorDiv.innerHTML = `<div class="error-message">${message}</div>`;
      }

      window.addEventListener("load", initializeMeeting);
    </script>
  </body>
</html>
