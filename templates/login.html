{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KanoonSathi | Login</title>
    <link rel="stylesheet" href="{% static 'style.css' %}" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body>
    <header class="topbar">
      <div class="container inner">
        <a class="logo" href="/">KanoonSathi</a>
        <nav class="menu" id="mainNav">
          <a href="/">Home</a>
          <a href="/consult/">Consult AI</a>
          <a href="/lawyers/">Find Lawyer</a>
          <a href="/appointments/">My Appointments</a>
          <a href="#" id="logoutLink" style="display: none">Logout</a>
        </nav>
        <button class="hamburger" onclick="toggleMenu()" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <div class="card auth-card">
          <h2 class="title">Login</h2>
          <p class="subtitle">Welcome back to KanoonSathi.</p>
          <form id="loginForm" class="form-grid">
            <div class="form-control full">
              <label for="email">Email address</label>
              <input
                id="email"
                type="email"
                placeholder="name@domain.com"
                required
              />
            </div>
            <div class="form-control full">
              <label for="password">Password</label>
              <input
                id="password"
                type="password"
                placeholder="Enter password"
                required
              />
            </div>
            <div class="form-control role-selection full">
              <label class="radio-label">
                <input type="radio" name="role" value="user" checked />
                <span>Login as User</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="role" value="lawyer" />
                <span>Login as Lawyer</span>
              </label>
            </div>
            <button class="btn-primary full" type="submit">Login</button>
          </form>
          <div class="auth-divider"><span>or</span></div>
          <div id="googleBtn" class="btn-google full"></div>
          <p id="msg" class="subtitle"></p>
          <p class="subtitle" style="margin-top: 1.2rem">
            New to KanoonSathi? <a href="/signup/">Create an account</a>
          </p>
        </div>
      </div>
    </section>

    <script>
      function toggleMenu() {
        document.querySelector(".menu").classList.toggle("open");
      }

      (function () {
        try {
          const auth = localStorage.getItem("kanoon_auth");
          const logoutLink = document.getElementById("logoutLink");
          if (logoutLink) {
            logoutLink.addEventListener("click", (e) => {
              e.preventDefault();
              localStorage.removeItem("kanoon_auth");
              location.href = "/";
            });
          }
          if (auth && logoutLink) logoutLink.style.display = "inline";
        } catch (e) {}
      })();

      const msg = document.getElementById("msg");
      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const role = document.querySelector('input[name="role"]:checked').value;
        if (!email || !password) {
          msg.textContent = "Please fill in all fields.";
          msg.style.color = "#b91c1c";
          return;
        }

        msg.textContent = "Logging in...";
        msg.style.color = "#3b82f6";

        fetch("/login/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            email,
            password,
            role,
          }),
        })
          .then(async (res) => {
            const data = await res.json();
            if (!res.ok) {
              msg.textContent = data.error || "Login failed.";
              msg.style.color = "#b91c1c";
              return;
            }
            const redirectUrl =
              data.redirect_url ||
              (role === "lawyer" ? "/lawyer-dashboard/" : "/dashboard/");
            const auth = {
              name: data.name || email.split("@")[0],
              email,
              role: data.role || role,
              token: data.token || null,
              source: "password",
              loggedInAt: new Date().toISOString(),
            };
            localStorage.setItem("kanoon_auth", JSON.stringify(auth));
            msg.textContent = "Login successful. Redirecting...";
            msg.style.color = "#16a34a";
            setTimeout(() => {
              location.href = redirectUrl;
            }, 800);
          })
          .catch((err) => {
            msg.textContent = "Login failed: " + err.message;
            msg.style.color = "#b91c1c";
          });
      });

      function handleGoogleAuthResponse(response) {
        console.log("Google callback received", response);
        msg.textContent = "Logging in with Google...";
        msg.style.color = "#3b82f6";

        if (!response || !response.credential) {
          console.error("Google callback missing credential", response);
          msg.textContent = "Google Sign-In failed. No credential received.";
          msg.style.color = "#b91c1c";
          return;
        }

        const role =
          document.querySelector('input[name="role"]:checked')?.value || "user";

        fetch("/api/auth/google", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            token: response.credential,
            role: role,
          }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.error) {
              msg.textContent = data.error;
              msg.style.color = "#b91c1c";
              return;
            }
            const actualRole = data.role || role;
            const auth = {
              name: data.name || data.email.split("@")[0],
              email: data.email,
              role: actualRole,
              token: response.credential,
              source: "google",
              loggedInAt: new Date().toISOString(),
            };
            localStorage.setItem("kanoon_auth", JSON.stringify(auth));
            msg.textContent = "Login successful. Redirecting...";
            msg.style.color = "#16a34a";
            setTimeout(() => {
              location.href =
                data.redirect_url ||
                (actualRole === "lawyer"
                  ? "/lawyer-dashboard/"
                  : "/dashboard/");
            }, 1000);
          })
          .catch((err) => {
            msg.textContent = "Login failed: " + err.message;
            msg.style.color = "#b91c1c";
            console.error("Google OAuth error:", err);
          });
      }

      function onGoogleSignInError() {
        msg.textContent = "Google Sign-In failed. Please try again.";
        msg.style.color = "#b91c1c";
      }

      function initializeGoogleAuth() {
        if (window.google && google.accounts && google.accounts.id) {
          google.accounts.id.initialize({
            client_id: "{{ google_client_id }}",
            callback: handleGoogleAuthResponse,
            ux_mode: "popup",
            cancel_on_tap_outside: false,
          });

          const googleBtn = document.getElementById("googleBtn");
          if (googleBtn) {
            google.accounts.id.renderButton(googleBtn, {
              theme: "outline",
              size: "large",
              text: "continue_with",
            });
          }
        } else {
          setTimeout(initializeGoogleAuth, 150);
        }
      }

      window.addEventListener("load", initializeGoogleAuth);
    </script>
  </body>
</html>
