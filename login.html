<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KanoonSathi | Login</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="topbar">
        <div class="container inner">
            <a class="logo" href="index.html">KanoonSathi</a>
            <nav class="menu" id="mainNav">
                <a href="index.html">Home</a>
                <a href="consult.html">Consult AI</a>
                <a href="lawyers.html">Find Lawyer</a>
                <a href="appointments.html">My Appointments</a>
                <a href="#" id="logoutLink" style="display:none;">Logout</a>
            </nav>
            <button class="hamburger" onclick="toggleMenu()" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div class="card auth-card">
                <h2 class="title">Login</h2>
                <p class="subtitle">Welcome back to KanoonSathi.</p>
                <form id="loginForm" class="form-grid">
                    <div class="form-control full">
                        <label for="email">Email address</label>
                        <input id="email" type="email" placeholder="name@domain.com" required />
                    </div>
                    <div class="form-control full">
                        <label for="password">Password</label>
                        <input id="password" type="password" placeholder="Enter password" required />
                    </div>
                    <div class="form-control role-selection full">
                        <label class="radio-label">
                            <input type="radio" name="role" value="user" checked />
                            <span>Login as User</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="role" value="lawyer" />
                            <span>Login as Lawyer</span>
                        </label>
                    </div>
                    <button class="btn-primary full" type="submit">Login</button>
                </form>
                <div class="auth-divider"><span>or</span></div>
                <button id="googleBtn" class="btn-google full" type="button">
                    <svg width="18" height="18" viewBox="0 0 48 48" fill="none" style="vertical-align:middle;margin-right:8px;">
                        <path d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z" fill="#FFC107"/>
                        <path d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z" fill="#FF3D00"/>
                        <path d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z" fill="#4CAF50"/>
                        <path d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z" fill="#1976D2"/>
                    </svg>
                    Continue with Google
                </button>
                <p id="msg" class="subtitle"></p>
                <p class="subtitle" style="margin-top:1.2rem;">New to KanoonSathi? <a href="signup.html">Create an account</a></p>
            </div>
        </div>
    </section>

    <script>
        function toggleMenu() {
            document.querySelector('.menu').classList.toggle('open');
        }

        (function () {
            try {
                const auth = localStorage.getItem('kanoon_auth');
                const logoutLink = document.getElementById('logoutLink');
                if (logoutLink) {
                    logoutLink.addEventListener('click', (e) => {
                        e.preventDefault();
                        localStorage.removeItem('kanoon_auth');
                        location.href = 'index.html';
                    });
                }
                if (auth && logoutLink) logoutLink.style.display = 'inline';
            } catch (e) { }
        })();

        const msg = document.getElementById("msg");
        document.getElementById("loginForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            if (!email || !password) {
                msg.textContent = 'Please fill in all fields.';
                msg.style.color = '#b91c1c';
                return;
            }
            const role = document.querySelector('input[name="role"]:checked').value;
            const auth = { name: email.split('@')[0], email, role, loggedInAt: new Date().toISOString() };
            localStorage.setItem('kanoon_auth', JSON.stringify(auth));
            location.href = "index.html";
        });

        document.getElementById("googleBtn").addEventListener("click", () => {
            const email = window.prompt("Enter your Google email:");
            if (!email) return;
            const name = window.prompt("Enter your display name (optional):") || email.split('@')[0];
            const auth = { name, email, role: 'user', loggedInAt: new Date().toISOString() };
            localStorage.setItem('kanoon_auth', JSON.stringify(auth));
            location.href = "index.html";
        });
    </script>
</body>

</html>
